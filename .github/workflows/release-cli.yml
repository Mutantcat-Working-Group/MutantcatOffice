name: Release CLI

# Builds the standalone genoffice CLI tar and Docker image for the version
# tag and uploads both to the GitHub Release. Pushing a version tag triggers
# the pipeline; workflow_dispatch republishes a tag manually.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (with v prefix), e.g. v1.0.20260920'
        required: false
        default: 'v1.0.20260920'
        type: string

concurrency:
  group: release-cli-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  GH_TOKEN: ${{ github.token }}

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Validate tag matches CLI version
        run: |
          expected="${RELEASE_TAG#v}"
          actual="$(node -p "require('./packages/cli/package.json').version")"
          if [ "$actual" != "$expected" ]; then
            echo "::error::packages/cli version is $actual but tag expects $expected"
            exit 1
          fi

      - name: Ensure release exists
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --title "MutantcatOffice ${RELEASE_TAG#v}" \
              --generate-notes || true
          fi

  cli-tar:
    needs: create-release
    strategy:
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch, 2026-07
        with:
          toolchain: stable

      - name: Cache cargo (xlsx-sidecar)
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: apps/sheets/native/xlsx-engine

      - name: Install dependencies
        run: npm ci

      - name: Build CLI bundle and sidecar
        run: |
          npm run build -w @genoffice/cli
          npm run native:build -w @genoffice/sheets

      - name: Package tar
        run: node scripts/package-cli.mjs ${{ matrix.arch }}

      - name: Upload tar
        shell: bash
        run: |
          version="$(node -p "require('./packages/cli/package.json').version")"
          gh release upload "$RELEASE_TAG" "release/mutantcatoffice-cli-${version}-${{ matrix.arch }}.tar.gz" --clobber

  docker:
    needs: create-release
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Resolve version
        id: version
        run: echo "value=$(node -p "require('./packages/cli/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: docker build -t mutantcatoffice-cli:${{ steps.version.outputs.value }} .

      - name: Export image tar
        run: |
          mkdir -p release
          docker save mutantcatoffice-cli:${{ steps.version.outputs.value }} | \
            gzip > "release/mutantcatoffice-cli-${{ steps.version.outputs.value }}-docker-${{ matrix.arch }}.tar.gz"

      - name: Upload image tar
        shell: bash
        run: gh release upload "$RELEASE_TAG" "release/mutantcatoffice-cli-${{ steps.version.outputs.value }}-docker-${{ matrix.arch }}.tar.gz" --clobber
