name: Release

# Builds every MutantcatOffice release artifact for a version tag
# (v1.0.YYYYMMDD) and publishes it to the GitHub Release:
#
#   - Windows NSIS installers (x64 + arm64)
#   - macOS DMG + zip (arm64, and x64 when GENOFFICE_MAC_X64 is set; CI sets
#     it, and the DMGs are ad-hoc signed so no Apple credentials are needed)
#   - Linux AppImage/deb/rpm (x64 + arm64)
#   - standalone genoffice CLI tarballs (x64 + arm64)
#   - Docker image tarballs for the CLI (amd64 + arm64)
#   - checksums.txt / checksums-md5.txt / checksums-sha1.txt
#
# Pushing a tag triggers the pipeline; workflow_dispatch republishes an
# existing tag manually.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (with v prefix), e.g. v1.0.20260927'
        required: false
        default: 'v1.0.20260927'
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  GH_TOKEN: ${{ github.token }}

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Validate tag matches app and CLI versions
        run: |
          expected="${RELEASE_TAG#v}"
          app="$(node -p "require('./apps/shell/package.json').version")"
          cli="$(node -p "require('./packages/cli/package.json').version")"
          if [ "$app" != "$expected" ] || [ "$cli" != "$expected" ]; then
            echo "::error::apps/shell=$app packages/cli=$cli but tag expects $expected"
            exit 1
          fi

      - name: Ensure release exists
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --title "MutantcatOffice ${RELEASE_TAG#v}" \
              --generate-notes || true
          fi

  mac:
    needs: create-release
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      GENOFFICE_MAC_X64: '1'
      GENOFFICE_MAC_ADHOC: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch, 2026-07
        with:
          toolchain: stable

      - name: Add Apple Rust targets
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - name: Cache cargo (xlsx-sidecar)
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: apps/sheets/native/xlsx-engine

      - name: Cache electron binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/electron
          key: electron-bin-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-bin-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Build installers
        run: npm run dist:mac

      - name: Verify macOS DMGs
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          images=(apps/shell/release/*.dmg)
          test "${#images[@]}" -eq 2
          for image in "${images[@]}"; do
            codesign --verify --strict --verbose=2 "${image}"
            hdiutil verify "${image}"
            mount="$(mktemp -d)"
            hdiutil attach -nobrowse -readonly -mountpoint "${mount}" "${image}" >/dev/null
            test -L "${mount}/Applications"
            app=("${mount}"/*.app)
            test "${#app[@]}" -eq 1
            test -d "${app[0]}"
            codesign --verify --deep --strict --verbose=2 "${app[0]}"
            hdiutil detach "${mount}" >/dev/null
          done

      - name: Upload macOS artifacts
        shell: bash
        run: |
          cd apps/shell/release
          gh release upload "$RELEASE_TAG" ./*.dmg ./*.zip --clobber

  win:
    needs: create-release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      matrix:
        include:
          - name: x64
            runner: windows-latest
            arm64: ''
            sidecar_target: x86_64-pc-windows-msvc
            build_dir: release
          - name: arm64
            runner: windows-11-arm
            arm64: '1'
            sidecar_target: aarch64-pc-windows-msvc
            build_dir: release-arm64
    env:
      GENOFFICE_WIN_ARM64: ${{ matrix.arm64 }}
      BUILD_DIR: ${{ matrix.build_dir }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch, 2026-07
        with:
          toolchain: stable

      - name: Add Windows Rust targets
        run: rustup target add x86_64-pc-windows-msvc aarch64-pc-windows-msvc

      - name: Cache cargo (xlsx-sidecar)
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: apps/sheets/native/xlsx-engine

      - name: Cache electron binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/electron
          key: electron-bin-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-bin-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Prepare Windows self-signed certificate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pfx = Join-Path $env:RUNNER_TEMP 'mutantcat-codesign.pfx'
          $password = 'mutantcat'
          $cert = New-SelfSignedCertificate `
            -Subject 'CN=Mutantcat Working Group, O=Mutantcat Working Group, C=CN' `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -KeyUsage DigitalSignature `
            -Type CodeSigningCert `
            -KeyExportPolicy Exportable `
            -KeyLength 2048 `
            -HashAlgorithm SHA256 `
            -NotAfter (Get-Date).AddYears(10)
          Export-PfxCertificate `
            -Cert $cert `
            -FilePath $pfx `
            -Password (ConvertTo-SecureString -String $password -Force -AsPlainText) | Out-Null

          $signtool = $null
          foreach ($kit in (Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Directory | Sort-Object Name -Descending)) {
            $candidate = Join-Path $kit.FullName 'x64\signtool.exe'
            if (Test-Path $candidate) { $signtool = $candidate; break }
          }
          if (-not $signtool) { throw 'signtool.exe not found in the Windows SDK' }

          "GENOFFICE_WIN_SIGNTOOL=$signtool" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "GENOFFICE_WIN_PFX=$pfx" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "GENOFFICE_WIN_PFX_PASSWORD=$password" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build installers
        shell: bash
        run: |
          npm run notices
          npm run build:all
          npm run native:build -w @mutantcatoffice/sheets -- --target "$SIDECAR_TARGET"
          npm run dist:win -w @mutantcatoffice/shell
        env:
          SIDECAR_TARGET: ${{ matrix.sidecar_target }}

      - name: Verify Windows signatures
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = 'CN=Mutantcat Working Group'
          $files = @(
            "apps/shell/$env:BUILD_DIR/win-unpacked/MutantcatOffice.exe",
            "apps/shell/$env:BUILD_DIR/win-unpacked/resources/native/xlsx-sidecar.exe",
            "apps/shell/$env:BUILD_DIR/win-unpacked/resources/ocr/win-ocr.exe"
          )
          $installer = Get-ChildItem "apps/shell/$env:BUILD_DIR" -Filter '*.exe' -File |
            Where-Object { $_.Name -like 'MutantcatOffice-Setup-*.exe' } |
            Select-Object -First 1
          if (-not $installer) { throw 'MutantcatOffice NSIS installer was not produced' }
          $files += $installer.FullName
          foreach ($file in $files) {
            if (-not (Test-Path $file)) { throw "missing signed artifact: $file" }
            $signature = Get-AuthenticodeSignature $file
            if (-not $signature.SignerCertificate -or $signature.SignerCertificate.Subject -notlike "*$expected*") {
              throw "invalid signer for $file : $($signature.Status)"
            }
            Write-Host "verified $file"
          }

      - name: Upload Windows installer
        shell: bash
        run: |
          cd "apps/shell/$BUILD_DIR"
          gh release upload "$RELEASE_TAG" ./*.exe --clobber

  linux:
    needs: create-release
    strategy:
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      GENOFFICE_LINUX_ARCH: ${{ matrix.arch }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch, 2026-07
        with:
          toolchain: stable

      - name: Cache cargo (xlsx-sidecar)
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: apps/sheets/native/xlsx-engine

      - name: Cache electron binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/electron
          key: electron-bin-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-bin-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Install rpmbuild
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm

      - name: Build installers
        run: npm run dist:linux

      - name: Upload Linux artifacts
        shell: bash
        run: |
          cd apps/shell/release
          gh release upload "$RELEASE_TAG" ./*.AppImage ./*.deb ./*.rpm --clobber

  cli-tar:
    needs: create-release
    strategy:
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch, 2026-07
        with:
          toolchain: stable

      - name: Cache cargo (xlsx-sidecar)
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: apps/sheets/native/xlsx-engine

      - name: Install dependencies
        run: npm ci

      - name: Build CLI bundle and sidecar
        run: |
          npm run build -w @mutantcatoffice/cli
          npm run native:build -w @mutantcatoffice/sheets

      - name: Package tar
        run: node scripts/package-cli.mjs ${{ matrix.arch }}

      - name: Upload tar
        shell: bash
        run: |
          version="$(node -p "require('./packages/cli/package.json').version")"
          gh release upload "$RELEASE_TAG" "release/mutantcatoffice-cli-${version}-${{ matrix.arch }}.tar.gz" --clobber

  docker:
    needs: create-release
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Resolve version
        id: version
        run: echo "value=$(node -p "require('./packages/cli/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: docker build -t mutantcatoffice-cli:${{ steps.version.outputs.value }} .

      - name: Export image tar
        run: |
          mkdir -p release
          docker save mutantcatoffice-cli:${{ steps.version.outputs.value }} | \
            gzip > "release/mutantcatoffice-cli-${{ steps.version.outputs.value }}-docker-${{ matrix.arch }}.tar.gz"

      - name: Upload image tar
        shell: bash
        run: gh release upload "$RELEASE_TAG" "release/mutantcatoffice-cli-${{ steps.version.outputs.value }}-docker-${{ matrix.arch }}.tar.gz" --clobber

  checksums:
    needs: [mac, win, linux, cli-tar, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Download release assets
        run: |
          mkdir -p dist
          gh release download "$RELEASE_TAG" --pattern '*' --dir dist

      - name: Generate checksums
        run: |
          : > dist/checksums.txt
          : > dist/checksums-md5.txt
          : > dist/checksums-sha1.txt
          count=0
          while IFS= read -r -d '' asset; do
            case "$(basename "$asset")" in
              checksums.txt|checksums-md5.txt|checksums-sha1.txt) continue ;;
            esac
            md5sum "$asset" | sed 's#  dist/#  #' >> dist/checksums-md5.txt
            sha1sum "$asset" | sed 's#  dist/#  #' >> dist/checksums-sha1.txt
            sha256sum "$asset" | sed 's#  dist/#  #' >> dist/checksums.txt
            count=$((count + 1))
          done < <(find dist -maxdepth 1 -type f -print0)
          if [ "$count" -eq 0 ]; then
            echo "::error::no release assets found to checksum"
            exit 1
          fi

      - name: Upload checksums
        run: gh release upload "$RELEASE_TAG" dist/checksums.txt dist/checksums-md5.txt dist/checksums-sha1.txt --clobber
